name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python é >=3.10: a menor e a mais recente suportadas.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # as verificações comparam com a branch base

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ambiente do backend
        working-directory: backend
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Portões de qualidade
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/check

      - name: Título e corpo da PR sem atribuição de IA
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_attribution.py --pr-event "$GITHUB_EVENT_PATH"
