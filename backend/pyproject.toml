[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devaneio"
version = "0.1.0"
description = "Mesa de RPG com mestre de IA — backend (esquema, motor de regras)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devaneio = ["rules/data/*.json", "narration/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
