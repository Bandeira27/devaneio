<label class="copy__label" [for]="inputId">{{ label() }}</label>
<div class="copy__row">
  <input
    #field
    [id]="inputId"
    class="dv-input copy__input"
    type="text"
    readonly
    [value]="text()"
    (focus)="select()"
  />
  <button dvButton dvSize="sm" type="button" class="copy__button" (click)="copy()">
    @if (state() === 'copied') {
      <dv-icon name="ok" size="sm" />Copiado
    } @else {
      <dv-icon name="copy" size="sm" />Copiar
    }
  </button>
</div>
<p class="copy__status" role="status">
  @switch (state()) {
    @case ('copied') {
      <span class="copy__tone copy__tone--ok" animate.enter="dv-enter" animate.leave="dv-leave">
        <dv-icon name="ok" size="sm" />Copiado.
      </span>
    }
    @case ('manual') {
      <span class="copy__tone copy__tone--warn" animate.enter="dv-enter" animate.leave="dv-leave">
        <dv-icon name="warn" size="sm" />Não consegui copiar sozinho: o texto está selecionado,
        copie à mão.
      </span>
    }
  }
</p>
