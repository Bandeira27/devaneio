@if (items().length === 0) {
  <p class="dv-note">{{ empty() }}</p>
} @else {
  <ul class="list">
    @for (item of items(); track $index; let i = $index; let first = $first; let last = $last) {
      <li class="item">
        <dv-disclosure
          [label]="nameOf()(item, i)"
          [open]="isOpen(i)"
          (openChange)="setOpen(i, $event)"
        >
          <div class="form dv-stack">
            <ng-container
              [ngTemplateOutlet]="template()"
              [ngTemplateOutletContext]="context(item, i)"
            />
            <div class="tools">
              <button
                dvButton
                dvSize="sm"
                type="button"
                [dvBlocked]="first"
                data-act="up"
                [attr.aria-label]="'Subir ' + nameOf()(item, i) + ' (' + position(i) + ')'"
                (click)="moved(i, -1)"
              >
                <dv-icon name="up" size="sm" />Subir
              </button>
              <button
                dvButton
                dvSize="sm"
                type="button"
                [dvBlocked]="last"
                data-act="down"
                [attr.aria-label]="'Descer ' + nameOf()(item, i) + ' (' + position(i) + ')'"
                (click)="moved(i, 1)"
              >
                <dv-icon name="down" size="sm" />Descer
              </button>
              <button
                dvSize="sm"
                dvButton="danger"
                type="button"
                class="tools__remove"
                [attr.aria-label]="'Remover ' + nameOf()(item, i) + ' (' + position(i) + ')'"
                (click)="removed(i)"
              >
                <dv-icon name="trash" size="sm" />Remover
              </button>
            </div>
          </div>
        </dv-disclosure>
      </li>
    }
  </ul>
}
<button #addButton dvButton type="button" class="add" (click)="add.emit()">
  <dv-icon name="add" size="sm" />Acrescentar {{ noun() }}
</button>
