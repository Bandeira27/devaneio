<div class="dv-stage">
  <div class="dv-stage__context">
    <dv-steps [steps]="steps" [current]="0" />
    <h1 class="dv-display">Entrar na mesa</h1>
    <p class="dv-lede dv-stage__extra">
      Você foi convidado para uma mesa de RPG com um mestre de IA. Diga como quer ser chamado e, no
      próximo passo, crie o seu personagem.
    </p>
    <dv-ornament class="dv-stage__extra" />
  </div>

  <form class="dv-stage__task dv-card" (submit)="$event.preventDefault(); store.join()">
    <dv-field label="Seu nome" [error]="store.nameError()">
      <input
        dvInput
        type="text"
        autocomplete="nickname"
        maxlength="40"
        [value]="store.name()"
        (input)="store.setName(fieldValue($event))"
      />
    </dv-field>
    @if (!invite()) {
      <dv-field label="Código do convite" [error]="store.codeError()">
        <input
          dvInput
          type="text"
          autocomplete="off"
          [value]="store.code()"
          (input)="store.setCode(fieldValue($event))"
        />
      </dv-field>
    } @else {
      <p class="dv-note">Convite recebido pelo link.</p>
    }
    @if (store.error()) {
      <dv-notice kind="error">{{ store.error() }}</dv-notice>
    }
    <button dvButton="primary" type="submit" [dvLoading]="store.joining()">Entrar</button>
  </form>
</div>
