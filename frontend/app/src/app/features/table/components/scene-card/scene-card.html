<section class="dv-card dv-card--page scene" aria-label="Cena">
  <h2 class="dv-section">{{ scene().name }}</h2>
  @if (scene().description) {
    <p class="dv-lede">{{ scene().description }}</p>
  }
  @if (facts().length > 0) {
    <dv-key-value [items]="facts()" />
  }
  @if (scene().exits.length > 0) {
    <div class="scene__exits">
      <p class="scene__label">Saídas</p>
      <ul class="scene__list">
        @for (exit of scene().exits; track exit.id) {
          <li>
            <button
              dvButton
              type="button"
              [dvBlocked]="!canGo()"
              [attr.aria-describedby]="blockedReasonId()"
              (click)="exitChosen.emit(exit.id)"
            >
              <dv-icon name="go" size="sm" /><span class="dv-visually-hidden">Ir para </span
              >{{ exit.name }}
            </button>
          </li>
        }
      </ul>
    </div>
  }
</section>
