<section class="dock" aria-label="Ações">
  @if (store.actionError()) {
    <dv-notice
      kind="error"
      dismissible
      (dismissed)="store.dismissFeedback()"
      animate.enter="dv-enter"
      animate.leave="dv-leave"
    >
      {{ store.actionError() }}
    </dv-notice>
  }
  @if (store.reply()) {
    <dv-notice
      dismissible
      (dismissed)="store.dismissFeedback()"
      animate.enter="dv-enter"
      animate.leave="dv-leave"
    >
      {{ store.reply() }}
    </dv-notice>
  }
  @if (store.blockedReason()) {
    <p id="dock-reason" class="dock__reason dv-note">{{ store.blockedReason() }}</p>
  }
  @if (store.actionBusy()) {
    <p class="dock__reason" role="status" animate.enter="dv-enter" animate.leave="dv-leave">
      <dv-badge tone="info" [pending]="true">
        {{ store.thinking() ? 'O mestre está pensando…' : 'Enviando…' }}
      </dv-badge>
    </p>
  }
  <div class="dock__buttons">
    <button
      dvButton
      type="button"
      [dvBlocked]="!!store.blockedReason() || store.actionBusy()"
      [attr.aria-describedby]="store.blockedReason() ? 'dock-reason' : null"
      (click)="go()"
    >
      <dv-icon name="go" size="sm" />Ir
    </button>
    <button
      dvButton
      type="button"
      [dvBlocked]="!!store.blockedReason() || store.actionBusy()"
      [attr.aria-describedby]="store.blockedReason() ? 'dock-reason' : null"
      (click)="check()"
    >
      <dv-icon name="check" size="sm" />Testar
    </button>
    <button
      dvButton
      type="button"
      [dvBlocked]="!!store.blockedReason() || store.actionBusy()"
      [attr.aria-describedby]="store.blockedReason() ? 'dock-reason' : null"
      (click)="attack()"
    >
      <dv-icon name="attack" size="sm" />Atacar
    </button>
    <button dvButton type="button" [disabled]="!store.character()" (click)="sheetOfCharacter()">
      <dv-icon name="sheet" size="sm" />Ficha
    </button>
    @if (store.canSay()) {
      <button
        dvButton="primary"
        type="button"
        [dvBlocked]="!!store.blockedReason() || store.actionBusy()"
        [attr.aria-describedby]="store.blockedReason() ? 'dock-reason' : null"
        (click)="say()"
      >
        <dv-icon name="say" size="sm" />Falar
      </button>
    }
    <button dvButton type="button" [dvBlocked]="store.actionBusy()" (click)="command()">
      <dv-icon name="command" size="sm" />Comando
    </button>
  </div>
</section>
