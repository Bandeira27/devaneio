<div class="feed" role="log" aria-live="polite" aria-label="O que aconteceu na mesa">
  @for (item of items(); track item.key) {
    @switch (item.type) {
      @case ('turn') {
        <h3 class="feed__turn" [class.feed__turn--current]="item.current">Turno {{ item.turn }}</h3>
      }
      @case ('event') {
        <article class="feed__event" [attr.data-tone]="item.tone" [style.--fade]="item.fade">
          <p class="feed__narration">{{ item.narration }}</p>
          <details class="feed__note">
            <summary>detalhes</summary>
            <p>{{ item.note }}</p>
          </details>
        </article>
      }
      @case ('talk') {
        <blockquote class="feed__talk" [style.--fade]="item.fade">
          <span class="feed__speaker">Mestre</span>
          <span class="feed__talk-text">{{ item.text }}</span>
        </blockquote>
      }
    }
  } @empty {
    <p class="dv-note">Nada aconteceu ainda. A história começa quando alguém agir.</p>
  }
  <div #end class="feed__end"></div>
</div>
