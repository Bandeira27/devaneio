<h2 class="dv-visually-hidden">O que aconteceu</h2>
<div class="feed" role="log" aria-live="polite" aria-label="O que aconteceu na mesa">
  @for (item of items(); track item.key) {
    @switch (item.type) {
      @case ('turn') {
        <h3 class="feed__turn" [class.feed__turn--current]="item.current">Turno {{ item.turn }}</h3>
      }
      @case ('event') {
        <article
          class="feed__event"
          [class.feed__event--new]="isNew(item.key)"
          [attr.data-tone]="item.tone"
          [style.--fade]="item.fade"
        >
          <p class="feed__narration">{{ item.narration }}</p>
          <dv-disclosure class="feed__note" label="Como foi resolvido">
            <p>{{ item.note }}</p>
          </dv-disclosure>
        </article>
      }
      @case ('talk') {
        <blockquote
          class="feed__talk"
          [class.feed__talk--new]="isNew(item.key)"
          [style.--fade]="item.fade"
        >
          <span class="feed__speaker">Mestre</span>
          <span class="feed__talk-text">{{ item.text }}</span>
        </blockquote>
      }
    }
  } @empty {
    <dv-state>Nada aconteceu ainda. A história começa quando alguém agir.</dv-state>
  }
  <div #end class="feed__end"></div>
</div>
